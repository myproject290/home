<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DA Arrear Calculator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23007bff%22/><text x=%2250%22 y=%2250%22 font-size=%2275%22 fill=%22white%22 font-family=%22Arial, sans-serif%22 font-weight=%22bold%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>DA</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23007bff%22/><text x=%2250%22 y=%2250%22 font-size=%2275%22 fill=%22white%22 font-family=%22Arial, sans-serif%22 font-weight=%22bold%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>DA</text></svg>">  

    <style>
        html {
            font-size: 19px;
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --accent-green: #059669;
            --accent-red: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-text-size-adjust: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 1.25rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: transparent;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 0.375rem;
        }

        #headerPeriod {
            color: #475569;
            font-size: 0.95rem;
            margin-top: 0.3rem;
            font-weight: 600;
            display: none;
        }

        .title-print {
            display: none;
        }

        .card {
            background: var(--card-bg);
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.375rem;
            color: #334155;
            cursor: default;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.625rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fff;
        }

        .form-group input[readonly] {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            cursor: not-allowed;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-color);
        }

        .acp-select-group {
            display: flex;
            gap: 0.5rem;
        }

        .acp-select-group select {
            flex: 1;
            min-width: 0;
        }

        .btn-container {
            margin-top: 1.25rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: white;
        }

        .btn-print { background-color: #28a745; }
        .btn-print:hover { background-color: #218838; }

        .btn-reset { background-color: #dc3545; }
        .btn-reset:hover { background-color: #c82333; }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .summary-card {
            background: var(--card-bg);
            border-radius: 0.625rem;
            padding: 1.125rem;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .summary-card.highlight {
            border-left: 0.3125rem solid var(--accent-green);
        }

        .summary-card h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        .summary-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .summary-card.highlight .value {
            color: var(--accent-green);
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 800px;
            border-collapse: collapse;
            font-size: 0.95rem;
            text-align: center;
        }

        th, td {
            padding: 0.5rem 0.2rem;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        th {
            background-color: #f1f5f9;
            color: #334155;
            font-weight: 600;
            white-space: normal;
            line-height: 1.3;
        }

        tfoot tr {
            background-color: #f8fafc;
            font-weight: bold;
        }

        th:nth-child(3), td:nth-child(3) {
            text-align: left;
            padding-left: 0.5rem;
        }

        td:nth-child(3) .table-input {
            text-align: left;
            text-align-last: left;
        }

        .table-input {
            width: 100%;
            padding: 0.35rem 0.2rem;
            border: 1px solid var(--border-color);
            border-radius: 0.25rem;
            font-size: 0.9rem;
            text-align: center;
            text-align-last: center;
            outline: none;
            background-color: #fff;
            transition: border-color 0.2s, background-color 0.2s;
            -moz-appearance: textfield;
        }

        .table-input::-webkit-outer-spin-button,
        .table-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .table-input.row-basic-input {
            min-width: 110px;
        }

        .table-input.row-month-select {
            min-width: 95px;
            cursor: pointer;
        }

        .table-input.row-year-input {
            min-width: 65px;
        }

        .table-input.row-prev-da-input,
        .table-input.row-rev-da-input {
            min-width: 65px;
        }

        .table-input:focus {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        .add-row-container {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }

        .add-row-btn {
            padding: 0.35rem 0.85rem;
            background-color: #ffffff;
            color: #dc2626;
            border: 1px solid #dc2626;
            border-radius: 0.25rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .add-row-btn:hover {
            background-color: #fef2f2;
        }

        .add-row-input {
            width: 60px;
            padding: 0.35rem 0.4rem;
            border: 1px solid #dc2626;
            border-radius: 0.25rem;
            font-size: 0.9rem;
            text-align: center;
            outline: none;
            color: #dc2626;
            background-color: #ffffff;
            font-weight: 600;
        }

        .add-row-input:focus {
            border-color: #b91c1c;
            box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.15);
        }

        .btn-delete-row {
            background: transparent;
            color: #dc2626;
            border: none;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            transition: color 0.2s, transform 0.1s;
        }

        .btn-delete-row:hover {
            color: #991b1b;
            transform: scale(1.15);
        }

        @page {
            size: A4 portrait;
            margin: 8mm;
        }

        @media print {
            html {
                font-size: 16px !important;
                -webkit-text-size-adjust: none !important;
                text-size-adjust: none !important;
            }

            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                color: #000 !important;
                font-size: 14px !important;
                line-height: 1.3 !important;
            }

            .container {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            header {
                text-align: center !important;
                margin-bottom: 10px !important;
            }

            header h1 {
                font-size: 1.5rem !important;
                margin-bottom: 2px !important;
                text-align: center !important;
            }

            .title-web {
                display: none !important;
            }

            .title-print {
                display: inline !important;
            }

            #headerPeriod {
                display: block !important;
                font-size: 13px !important;
                color: #334155 !important;
                margin-top: 2px !important;
            }

            .card:first-of-type {
                display: none !important;
            }

            .card {
                box-shadow: none !important;
                border: 1px solid #cbd5e1 !important;
                padding: 8px !important;
                margin-bottom: 8px !important;
                border-radius: 4px !important;
            }

            .summary-grid {
                display: grid !important;
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 6px !important;
                margin-bottom: 8px !important;
            }

            .summary-card {
                padding: 6px !important;
                border: 1px solid #cbd5e1 !important;
            }

            .summary-card h3 {
                font-size: 11px !important;
                margin-bottom: 2px !important;
            }

            .summary-card .value {
                font-size: 15px !important;
            }

            .table-responsive {
                overflow: visible !important;
            }

            table {
                width: 100% !important;
                min-width: 0 !important;
                table-layout: fixed !important;
                border-collapse: collapse !important;
            }

            th, td {
                padding: 6px 3px !important;
                font-size: 14px !important;
                line-height: 1.2 !important;
                border: 1px solid #334155 !important;
                text-align: center !important;
                vertical-align: middle !important;
                word-wrap: break-word !important;
                overflow-wrap: break-word !important;
                white-space: normal !important;
            }

            th {
                background-color: #f1f5f9 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                font-weight: 700 !important;
            }

            .table-input {
                border: none !important;
                background: transparent !important;
                box-shadow: none !important;
                font-size: 14px !important;
                font-family: inherit !important;
                color: #000 !important;
                text-align: center !important;
                text-align-last: center !important;
                width: 100% !important;
                max-width: 100% !important;
                min-width: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-appearance: none !important;
                -moz-appearance: none !important;
                appearance: none !important;
            }

            th:nth-child(3), td:nth-child(3) {
                text-align: left !important;
                padding-left: 6px !important;
            }

            td:nth-child(3) .table-input {
                text-align: left !important;
                text-align-last: left !important;
            }

            .no-print {
                display: none !important;
            }

            th:nth-child(2), td:nth-child(2) { width: 5%; }  
            th:nth-child(3), td:nth-child(3) { width: 14%; } 
            th:nth-child(4), td:nth-child(4) { width: 8%; }  
            th:nth-child(5), td:nth-child(5) { width: 12%; } 
            th:nth-child(6), td:nth-child(6) { width: 10%; } 
            th:nth-child(7), td:nth-child(7) { width: 10%; } 
            th:nth-child(8), td:nth-child(8) { width: 14%; } 
            th:nth-child(9), td:nth-child(9) { width: 12%; } 
            th:nth-child(10), td:nth-child(10) { width: 15%; } 

            tr {
                page-break-inside: avoid !important;
            }

            tfoot {
                display: table-row-group !important;
            }
        }
    </style>
</head>
<body>

<div class="container" id="printContent">
    <header>
        <h1>
            <span class="title-web">DA Arrear Calculator</span>
            <span class="title-print">DA Arrear Calculation Statement</span>
        </h1>
        <p id="headerPeriod"></p>
    </header>

    <div class="card">
        <div class="form-grid">
            <div class="form-group">
                <label>Employee Type</label>
                <select id="employeeType">
                    <option value="OPS" selected>OPS Employee</option>
                    <option value="NPS">NPS Employee</option>
                </select>
            </div>

            <div class="form-group" id="cpfGroup" style="display: none;">
                <label>NPS Share Rate (%)</label>
                <input type="number" id="gpfNps" value="10" step="0.1" min="0" max="100">
            </div>

            <div class="form-group">
                <label>Month of Annual Increment</label>
                <select id="incrementMonth">
                    <option value="None">None</option>
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10" selected>October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>

            <div class="form-group">
                <label>No. of ACP(s) during Arrear Period</label>
                <select id="noOfAcp">
                    <option value="0" selected>0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>

            <div id="acpContainer" style="display: contents;"></div>

            <div class="form-group">
                <label>Previous DA (%)</label>
                <input type="number" id="previousDa" value="0" step="0.01">
            </div>

            <div class="form-group">
                <label>Revised DA (%)</label>
                <input type="number" id="revisedDa" value="0" step="0.01">
            </div>

            <div class="form-group">
                <label>From Month & Year</label>
                <div class="acp-select-group">
                    <select id="fromMonth"></select>
                    <select id="fromYear"></select>
                </div>
            </div>

            <div class="form-group">
                <label>To Month & Year</label>
                <div class="acp-select-group">
                    <select id="toMonth"></select>
                    <select id="toYear"></select>
                </div>
            </div>

            <div class="form-group">
                <label>Total Months</label>
                <input type="text" id="totalMonths" value="0 Months" readonly>
            </div>

            <div class="form-group">
                <label id="basicPayLabel">Basic Pay as on From Month</label>
                <input type="number" id="basicPay" value="0" step="100">
            </div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn btn-print" onclick="printReport()">🖨️ Print / Save as PDF</button>
            <button type="button" class="btn btn-reset" onclick="resetCalculator()">🔄 Reset</button>
        </div>
    </div>

    <div class="summary-grid" id="summaryGrid">
        <div class="summary-card">
            <h3>Total Arrear</h3>
            <div class="value" id="totalGross">₹0</div>
        </div>
        <div class="summary-card">
            <h3>Total NPS Share Deducted</h3>
            <div class="value" id="totalCpf" style="color: var(--accent-red);">₹0</div>
        </div>
        <div class="summary-card highlight">
            <h3>Net Arrear</h3>
            <div class="value" id="totalNet">₹0</div>
        </div>
    </div>

    <div class="card" id="tableCard">
        <h2 style="font-size: 1.1rem; margin-bottom: 1rem; color: var(--primary-color);">Monthly Arrear Statement</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th class="no-print" style="width: 35px;"></th>
                        <th>Sr.<br>No.</th>
                        <th>Month</th>
                        <th>Year</th>
                        <th>Basic Pay</th>
                        <th>Previous<br>DA (%)</th>
                        <th>Revised<br>DA (%)</th>
                        <th>Total Arrear</th>
                        <th>NPS Share<br>Deducted</th>
                        <th>Net Arrear</th>
                    </tr>
                </thead>
                <tbody id="breakdownTableBody">
                </tbody>
                <tfoot>
                    <tr class="no-print">
                        <td colspan="10" style="text-align: left; background-color: #ffffff; padding: 6px 12px;">
                            <div class="add-row-container">
                                <button type="button" class="add-row-btn" onclick="addCustomRows()">➕ Add Row(s)</button>
                                <input 
                                    type="number" 
                                    id="addRowInput" 
                                    class="add-row-input" 
                                    value="1" 
                                    min="1" 
                                    max="50"
                                    onfocus="clearAddRowInput(this)"
                                    onblur="restoreAddRowInput(this)"
                                >
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="no-print"></td>
                        <td colspan="6" style="text-align: right;"><strong>Total:</strong></td>
                        <td id="footTotalGross">₹0</td>
                        <td id="footTotalCpf" style="color: var(--accent-red);">₹0</td>
                        <td id="footTotalNet" style="color: var(--accent-green);">₹0</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

<script>
    const MONTH_NAMES = [
        "January", "February", "March", "April", "May", "June", 
        "July", "August", "September", "October", "November", "December"
    ];

    let addRowPreviousVal = "1";

    function clearAddRowInput(input) {
        addRowPreviousVal = input.value;
        input.value = "";
    }

    function restoreAddRowInput(input) {
        if (input.value.trim() === "") {
            input.value = addRowPreviousVal;
        }
    }

    function deleteRow(button) {
        const row = button.closest('tr');
        row.remove();
        updateRowNumbers();
        recalculateTableFromStart();
    }

    function updateHeaderPeriod() {
        const rows = document.querySelectorAll('#breakdownTableBody tr');
        const periodEl = document.getElementById('headerPeriod');
        if (!periodEl) return;

        if (rows.length > 0) {
            const firstRow = rows[0];
            const lastRow = rows[rows.length - 1];

            const firstMonthNum = parseInt(firstRow.querySelector('.row-month-select').value) || 1;
            const firstYearVal = firstRow.querySelector('.row-year-input').value;
            
            const lastMonthNum = parseInt(lastRow.querySelector('.row-month-select').value) || 1;
            const lastYearVal = lastRow.querySelector('.row-year-input').value;

            const firstDateObj = new Date(parseInt(firstYearVal), firstMonthNum - 1, 1);
            const lastDateObj = new Date(parseInt(lastYearVal), lastMonthNum - 1, 1);

            const fromFormatted = firstDateObj.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            const toFormatted = lastDateObj.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            periodEl.textContent = `(${fromFormatted} to ${toFormatted})`;
        } else {
            periodEl.textContent = '';
        }
    }

    function printReport() {
        const rows = document.querySelectorAll('#breakdownTableBody tr');
        let fromFormatted = '';
        let toFormatted = '';

        if (rows.length > 0) {
            const firstRow = rows[0];
            const lastRow = rows[rows.length - 1];

            const firstMonthNum = parseInt(firstRow.querySelector('.row-month-select').value) || 1;
            const firstYearVal = firstRow.querySelector('.row-year-input').value;
            
            const lastMonthNum = parseInt(lastRow.querySelector('.row-month-select').value) || 1;
            const lastYearVal = lastRow.querySelector('.row-year-input').value;

            const firstDateObj = new Date(parseInt(firstYearVal), firstMonthNum - 1, 1);
            const lastDateObj = new Date(parseInt(lastYearVal), lastMonthNum - 1, 1);

            fromFormatted = firstDateObj.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            toFormatted = lastDateObj.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        }

        const fileName = (fromFormatted && toFormatted)
            ? `DA Arrear Report ${fromFormatted} to ${toFormatted}`
            : `DA Arrear Report`;

        document.title = fileName;

        if (window.Android && typeof window.Android.printPage === 'function') {
            window.Android.printPage(fileName);
        } else {
            window.print();
        }
    }

    function formatCurrency(amount) {
        return '₹' + amount.toLocaleString('en-IN', { maximumFractionDigits: 0 });
    }

    function toggleCpfVisibility() {
        const empType = document.getElementById('employeeType').value;
        const cpfGroup = document.getElementById('cpfGroup');
        const gpfNpsInput = document.getElementById('gpfNps');

        if (empType === 'OPS') {
            cpfGroup.style.display = 'none';
        } else {
            cpfGroup.style.display = 'flex';
            if (!gpfNpsInput.value || parseFloat(gpfNpsInput.value) === 0) {
                gpfNpsInput.value = 10;
            }
        }
    }

    function initFromToDropdowns() {
        const startYr = 2000;
        const endYr = 2050;

        const fromM = document.getElementById('fromMonth');
        const fromY = document.getElementById('fromYear');
        const toM = document.getElementById('toMonth');
        const toY = document.getElementById('toYear');

        fromM.innerHTML = '';
        toM.innerHTML = '';
        fromY.innerHTML = '';
        toY.innerHTML = '';

        MONTH_NAMES.forEach((mName, idx) => {
            const opt1 = document.createElement('option');
            opt1.value = idx + 1;
            opt1.textContent = mName;
            fromM.appendChild(opt1);

            const opt2 = document.createElement('option');
            opt2.value = idx + 1;
            opt2.textContent = mName;
            toM.appendChild(opt2);
        });

        for (let y = startYr; y <= endYr; y++) {
            const opt1 = document.createElement('option');
            opt1.value = y;
            opt1.textContent = y;
            fromY.appendChild(opt1);

            const opt2 = document.createElement('option');
            opt2.value = y;
            opt2.textContent = y;
            toY.appendChild(opt2);
        }

        fromM.value = "7";
        fromY.value = "2022";
        toM.value = "6";
        toY.value = "2023";

        [fromM, fromY, toM, toY].forEach(el => {
            el.addEventListener('change', calculateArrears);
        });
    }

    function getAcpYearMonth(index) {
        const monthEl = document.getElementById(`acpMonth${index}`);
        const yearEl = document.getElementById(`acpYear${index}`);
        if (monthEl && yearEl && monthEl.value && yearEl.value) {
            return `${yearEl.value}-${String(monthEl.value).padStart(2, '0')}`;
        }
        return null;
    }

    function renderAcpInputs() {
        const count = parseInt(document.getElementById('noOfAcp').value) || 0;
        const container = document.getElementById('acpContainer');
        
        const defaultAcps = [
            { month: 10, year: 2011 },
            { month: 10, year: 2016 },
            { month: 10, year: 2021 }
        ];

        const existingValues = [];
        for (let i = 1; i <= 3; i++) {
            const mEl = document.getElementById(`acpMonth${i}`);
            const yEl = document.getElementById(`acpYear${i}`);
            if (mEl && yEl) {
                existingValues.push({ month: mEl.value, year: yEl.value });
            }
        }

        container.innerHTML = '';

        const startYr = 2000;
        const endYr = 2050;

        for (let i = 1; i <= count; i++) {
            const def = defaultAcps[i - 1] || { month: 10, year: 2024 };
            const saved = existingValues[i - 1];

            const selMonth = saved ? parseInt(saved.month) : def.month;
            const selYear = saved ? parseInt(saved.year) : def.year;

            const fg = document.createElement('div');
            fg.className = 'form-group';
            
            const lbl = document.createElement('label');
            lbl.textContent = count === 1 ? 'Month & Year of ACP' : `Month & Year of ACP ${i}`;
            
            const groupDiv = document.createElement('div');
            groupDiv.className = 'acp-select-group';

            const selectMonth = document.createElement('select');
            selectMonth.id = `acpMonth${i}`;
            
            MONTH_NAMES.forEach((mName, idx) => {
                const opt = document.createElement('option');
                opt.value = idx + 1;
                opt.textContent = mName;
                if (idx + 1 === selMonth) opt.selected = true;
                selectMonth.appendChild(opt);
            });

            selectMonth.addEventListener('change', calculateArrears);

            const selectYear = document.createElement('select');
            selectYear.id = `acpYear${i}`;

            for (let y = startYr; y <= endYr; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === selYear) opt.selected = true;
                selectYear.appendChild(opt);
            }

            selectYear.addEventListener('change', calculateArrears);

            groupDiv.appendChild(selectMonth);
            groupDiv.appendChild(selectYear);

            fg.appendChild(lbl);
            fg.appendChild(groupDiv);

            container.appendChild(fg);
        }

        calculateArrears();
    }

    document.getElementById('employeeType').addEventListener('change', function() {
        toggleCpfVisibility();
        calculateArrears();
    });

    document.getElementById('noOfAcp').addEventListener('change', renderAcpInputs);

    function calculateArrears() {
        const incMonth = document.getElementById('incrementMonth').value;
        
        const noOfAcp = parseInt(document.getElementById('noOfAcp').value) || 0;
        const acpMonths = [];
        for (let i = 1; i <= noOfAcp; i++) {
            const acpVal = getAcpYearMonth(i);
            if (acpVal) {
                acpMonths.push(acpVal);
            }
        }

        const prevDaRate = parseFloat(document.getElementById('previousDa').value) || 0;
        const revDaRate = parseFloat(document.getElementById('revisedDa').value) || 0;
        
        const fM = document.getElementById('fromMonth').value;
        const fY = document.getElementById('fromYear').value;
        const tM = document.getElementById('toMonth').value;
        const tY = document.getElementById('toYear').value;

        const fromMonthVal = (fM && fY) ? `${fY}-${String(fM).padStart(2, '0')}` : '';
        const toMonthVal = (tM && tY) ? `${tY}-${String(tM).padStart(2, '0')}` : '';

        let startBasic = parseFloat(document.getElementById('basicPay').value) || 0;

        const basicPayLabel = document.getElementById('basicPayLabel');
        if (fromMonthVal) {
            const [year, month] = fromMonthVal.split('-');
            const dateObj = new Date(year, parseInt(month) - 1, 1);
            const monthYearStr = dateObj.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
            basicPayLabel.textContent = `Basic Pay as on ${monthYearStr}`;
        } else {
            basicPayLabel.textContent = `Basic Pay as on From Month`;
        }

        if (!fromMonthVal || !toMonthVal) {
            document.getElementById('totalMonths').value = '0 Months';
            document.getElementById('summaryGrid').style.display = 'none';
            document.getElementById('tableCard').style.display = 'none';
            document.getElementById('headerPeriod').textContent = '';
            return;
        }

        const startDate = new Date(fromMonthVal + '-01');
        const endDate = new Date(toMonthVal + '-01');

        if (startDate > endDate) {
            document.getElementById('totalMonths').value = 'Invalid Period';
            document.getElementById('summaryGrid').style.display = 'none';
            document.getElementById('tableCard').style.display = 'none';
            document.getElementById('headerPeriod').textContent = '';
            return;
        }

        const monthsList = [];
        let curr = new Date(startDate);
        while (curr <= endDate) {
            monthsList.push(new Date(curr));
            curr.setMonth(curr.getMonth() + 1);
        }

        const monthCount = monthsList.length;
        document.getElementById('totalMonths').value = monthCount + (monthCount === 1 ? ' Month' : ' Months');

        const tableBody = document.getElementById('breakdownTableBody');
        tableBody.innerHTML = '';

        let currentRunningBasic = startBasic;

        monthsList.forEach((monthDate, index) => {
            const mIndex = monthDate.getMonth() + 1;
            const yearStr = monthDate.getFullYear();
            
            const currentYearMonthStr = `${yearStr}-${String(mIndex).padStart(2, '0')}`;

            const isAcpMonth = (index > 0 && acpMonths.includes(currentYearMonthStr));
            const isIncMonth = (index > 0 && incMonth !== 'None' && parseInt(incMonth) === mIndex);

            if (index > 0) {
                if (isAcpMonth) {
                    const inc1 = Math.round((currentRunningBasic * 0.03) / 100) * 100;
                    currentRunningBasic += inc1;
                    const inc2 = Math.round((currentRunningBasic * 0.03) / 100) * 100;
                    currentRunningBasic += inc2;
                } else if (isIncMonth) {
                    const inc1 = Math.round((currentRunningBasic * 0.03) / 100) * 100;
                    currentRunningBasic += inc1;
                }
            }

            const row = document.createElement('tr');
            row.dataset.isAcp = isAcpMonth;
            row.dataset.isInc = isIncMonth;

            let monthOptionsHtml = '';
            MONTH_NAMES.forEach((mName, mIdx) => {
                const selected = (mIdx + 1 === mIndex) ? 'selected' : '';
                monthOptionsHtml += `<option value="${mIdx + 1}" ${selected}>${mName}</option>`;
            });

            row.innerHTML = `
                <td class="no-print">
                    <button type="button" class="btn-delete-row" onclick="deleteRow(this)" title="Delete Row">✕</button>
                </td>
                <td>${index + 1}.</td>
                <td>
                    <select class="table-input row-month-select">
                        ${monthOptionsHtml}
                    </select>
                </td>
                <td>
                    <input type="number" class="table-input row-year-input" value="${yearStr}" min="1900" max="2100">
                </td>
                <td><input type="number" class="table-input row-basic-input" value="${currentRunningBasic}" step="100"></td>
                <td><input type="number" class="table-input row-prev-da-input" value="${prevDaRate}" step="0.01"></td>
                <td><input type="number" class="table-input row-rev-da-input" value="${revDaRate}" step="0.01"></td>
                <td class="row-gross">₹0</td>
                <td class="row-cpf">₹0</td>
                <td class="row-net"><strong>₹0</strong></td>
            `;

            tableBody.appendChild(row);

            attachRowEventListeners(row, index);
            updateRowCalculations(row);
        });

        document.getElementById('summaryGrid').style.display = 'grid';
        document.getElementById('tableCard').style.display = 'block';

        updateTotals();
        updateHeaderPeriod();
    }

    function addCustomRows() {
        const countInput = document.getElementById('addRowInput');
        const countToAdd = parseInt(countInput.value, 10);
        
        if (isNaN(countToAdd) || countToAdd <= 0) return;

        const tableBody = document.getElementById('breakdownTableBody');

        for (let i = 0; i < countToAdd; i++) {
            const currentRows = tableBody.querySelectorAll('tr');
            const lastRow = currentRows.length > 0 ? currentRows[currentRows.length - 1] : null;

            let nextMonthIndex = 1;
            let nextYear = new Date().getFullYear();
            let lastPrevDa = parseFloat(document.getElementById('previousDa').value) || 0;
            let lastRevDa = parseFloat(document.getElementById('revisedDa').value) || 0;

            if (lastRow) {
                const selMonth = parseInt(lastRow.querySelector('.row-month-select').value) || 1;
                const valYear = parseInt(lastRow.querySelector('.row-year-input').value) || nextYear;
                
                if (selMonth === 12) {
                    nextMonthIndex = 1;
                    nextYear = valYear + 1;
                } else {
                    nextMonthIndex = selMonth + 1;
                    nextYear = valYear;
                }

                lastPrevDa = parseFloat(lastRow.querySelector('.row-prev-da-input').value) || lastPrevDa;
                lastRevDa = parseFloat(lastRow.querySelector('.row-rev-da-input').value) || lastRevDa;
            }

            const rowIndex = currentRows.length;
            const row = document.createElement('tr');
            row.dataset.isAcp = 'false';
            row.dataset.isInc = 'false';

            let monthOptionsHtml = '';
            MONTH_NAMES.forEach((mName, mIdx) => {
                const selected = (mIdx + 1 === nextMonthIndex) ? 'selected' : '';
                monthOptionsHtml += `<option value="${mIdx + 1}" ${selected}>${mName}</option>`;
            });

            row.innerHTML = `
                <td class="no-print">
                    <button type="button" class="btn-delete-row" onclick="deleteRow(this)" title="Delete Row">✕</button>
                </td>
                <td>${rowIndex + 1}.</td>
                <td>
                    <select class="table-input row-month-select">
                        ${monthOptionsHtml}
                    </select>
                </td>
                <td>
                    <input type="number" class="table-input row-year-input" value="${nextYear}" min="1900" max="2100">
                </td>
                <td><input type="number" class="table-input row-basic-input" value="0" step="100"></td>
                <td><input type="number" class="table-input row-prev-da-input" value="${lastPrevDa}" step="0.01"></td>
                <td><input type="number" class="table-input row-rev-da-input" value="${lastRevDa}" step="0.01"></td>
                <td class="row-gross">₹0</td>
                <td class="row-cpf">₹0</td>
                <td class="row-net"><strong>₹0</strong></td>
            `;

            tableBody.appendChild(row);

            attachRowEventListeners(row, rowIndex);
        }

        countInput.value = "1";
        addRowPreviousVal = "1";

        updateRowNumbers();
        recalculateTableFromStart();
    }

    function attachRowEventListeners(row, initialIndex) {
        const rowInputs = row.querySelectorAll('.table-input');
        rowInputs.forEach(input => {
            input.addEventListener('input', (e) => handleRowInputChange(e));
            input.addEventListener('change', (e) => handleRowInputChange(e));

            if (input.tagName === 'INPUT') {
                input.addEventListener('focus', function() {
                    this.dataset.previousVal = this.value;
                    this.value = '';
                });
                input.addEventListener('blur', function() {
                    if (this.value.trim() === '') {
                        this.value = this.dataset.previousVal !== undefined ? this.dataset.previousVal : '';
                        handleRowInputChange({ target: this });
                    }
                });
            }
        });
    }

    function updateRowNumbers() {
        const rows = document.querySelectorAll('#breakdownTableBody tr');
        rows.forEach((r, idx) => {
            r.querySelector('td:nth-child(2)').textContent = `${idx + 1}.`;
        });
    }

    function handleRowInputChange(event) {
        const rows = Array.from(document.querySelectorAll('#breakdownTableBody tr'));
        const target = event.target;
        const row = target.closest('tr');
        const rowIndex = rows.indexOf(row);

        if (rowIndex === -1) return;

        if (target.classList.contains('row-basic-input')) {
            row.dataset.manualBasic = "true";
        } else if (target.classList.contains('row-month-select') || target.classList.contains('row-year-input')) {
            let currentMonth = parseInt(row.querySelector('.row-month-select').value) || 1;
            let currentYear = parseInt(row.querySelector('.row-year-input').value) || new Date().getFullYear();

            for (let k = rowIndex + 1; k < rows.length; k++) {
                if (currentMonth === 12) {
                    currentMonth = 1;
                    currentYear += 1;
                } else {
                    currentMonth += 1;
                }

                rows[k].querySelector('.row-month-select').value = currentMonth;
                rows[k].querySelector('.row-year-input').value = currentYear;
            }
        } else if (target.classList.contains('row-prev-da-input')) {
            const newPrevDa = target.value;
            for (let k = rowIndex + 1; k < rows.length; k++) {
                rows[k].querySelector('.row-prev-da-input').value = newPrevDa;
            }
        } else if (target.classList.contains('row-rev-da-input')) {
            const newRevDa = target.value;
            for (let k = rowIndex + 1; k < rows.length; k++) {
                rows[k].querySelector('.row-rev-da-input').value = newRevDa;
            }
        }

        recalculateTableFromStart();
    }

    function recalculateTableFromStart() {
        const rows = Array.from(document.querySelectorAll('#breakdownTableBody tr'));
        if (rows.length === 0) {
            updateHeaderPeriod();
            return;
        }

        const incMonth = document.getElementById('incrementMonth').value;
        const noOfAcp = parseInt(document.getElementById('noOfAcp').value) || 0;
        const acpMonths = [];
        for (let i = 1; i <= noOfAcp; i++) {
            const acpVal = getAcpYearMonth(i);
            if (acpVal) {
                acpMonths.push(acpVal);
            }
        }

        let runningBasic = parseFloat(document.getElementById('basicPay').value) || 0;

        rows.forEach((row, index) => {
            const mIndex = parseInt(row.querySelector('.row-month-select').value) || 1;
            const yearStr = row.querySelector('.row-year-input').value;
            const currentYearMonthStr = `${yearStr}-${String(mIndex).padStart(2, '0')}`;

            const isAcpMonth = (index > 0 && acpMonths.includes(currentYearMonthStr));
            const isIncMonth = (index > 0 && incMonth !== 'None' && parseInt(incMonth) === mIndex);

            row.dataset.isAcp = isAcpMonth;
            row.dataset.isInc = isIncMonth;

            if (index === 0) {
                if (row.dataset.manualBasic !== "true") {
                    row.querySelector('.row-basic-input').value = runningBasic;
                } else {
                    runningBasic = parseFloat(row.querySelector('.row-basic-input').value) || runningBasic;
                }
            } else {
                if (row.dataset.manualBasic === "true") {
                    runningBasic = parseFloat(row.querySelector('.row-basic-input').value) || runningBasic;
                } else {
                    if (isAcpMonth) {
                        const inc1 = Math.round((runningBasic * 0.03) / 100) * 100;
                        runningBasic += inc1;
                        const inc2 = Math.round((runningBasic * 0.03) / 100) * 100;
                        runningBasic += inc2;
                    } else if (isIncMonth) {
                        const inc1 = Math.round((runningBasic * 0.03) / 100) * 100;
                        runningBasic += inc1;
                    }
                    row.querySelector('.row-basic-input').value = runningBasic;
                }
            }

            updateRowCalculations(row);
        });

        updateTotals();
        updateHeaderPeriod();
    }

    function updateRowCalculations(row) {
        const empType = document.getElementById('employeeType').value;
        let cpfRate = parseFloat(document.getElementById('gpfNps').value) || 0;
        
        if (empType === 'OPS') {
            cpfRate = 0;
        }

        const basic = parseFloat(row.querySelector('.row-basic-input').value) || 0;
        const prevDaRate = parseFloat(row.querySelector('.row-prev-da-input').value) || 0;
        const revDaRate = parseFloat(row.querySelector('.row-rev-da-input').value) || 0;

        const prevDaAmount = Math.round(basic * (prevDaRate / 100));
        const revDaAmount = Math.round(basic * (revDaRate / 100));
        
        const totalArrear = revDaAmount - prevDaAmount;
        
        if (empType === 'OPS') {
            row.querySelector('.row-gross').textContent = formatCurrency(totalArrear);
            row.querySelector('.row-cpf').textContent = 'N/A';
            row.querySelector('.row-net').innerHTML = `<strong>${formatCurrency(totalArrear)}</strong>`;

            row.dataset.gross = totalArrear;
            row.dataset.cpf = 0;
            row.dataset.net = totalArrear;
        } else {
            const cpfAmount = Math.round(totalArrear * (cpfRate / 100));
            const netArrear = totalArrear - cpfAmount;

            row.querySelector('.row-gross').textContent = formatCurrency(totalArrear);
            row.querySelector('.row-cpf').textContent = formatCurrency(cpfAmount);
            row.querySelector('.row-net').innerHTML = `<strong>${formatCurrency(netArrear)}</strong>`;

            row.dataset.gross = totalArrear;
            row.dataset.cpf = cpfAmount;
            row.dataset.net = netArrear;
        }
    }

    function updateTotals() {
        const empType = document.getElementById('employeeType').value;
        let totalGross = 0;
        let totalCpf = 0;
        let totalNet = 0;

        const rows = document.querySelectorAll('#breakdownTableBody tr');
        rows.forEach(row => {
            totalGross += parseFloat(row.dataset.gross) || 0;
            totalCpf += parseFloat(row.dataset.cpf) || 0;
            totalNet += parseFloat(row.dataset.net) || 0;
        });

        document.getElementById('totalGross').textContent = formatCurrency(totalGross);
        document.getElementById('totalCpf').textContent = (empType === 'OPS') ? 'N/A' : formatCurrency(totalCpf);
        document.getElementById('totalNet').textContent = formatCurrency(totalNet);

        document.getElementById('footTotalGross').textContent = formatCurrency(totalGross);
        document.getElementById('footTotalCpf').textContent = (empType === 'OPS') ? 'N/A' : formatCurrency(totalCpf);
        document.getElementById('footTotalNet').textContent = formatCurrency(totalNet);
    }

    function resetCalculator() {
        document.getElementById('employeeType').value = 'OPS';
        document.getElementById('gpfNps').value = 10;
        document.getElementById('incrementMonth').value = '10';
        document.getElementById('noOfAcp').value = '0';
        renderAcpInputs();
        document.getElementById('previousDa').value = 0;
        document.getElementById('revisedDa').value = 0;

        document.getElementById('fromMonth').value = '7';
        document.getElementById('fromYear').value = '2022';
        document.getElementById('toMonth').value = '6';
        document.getElementById('toYear').value = '2023';

        document.getElementById('basicPay').value = 0;
        document.getElementById('addRowInput').value = 1;
        toggleCpfVisibility();
        calculateArrears();
    }

    ['previousDa', 'revisedDa', 'basicPay', 'gpfNps'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;

        el.addEventListener('focus', function() {
            this.dataset.previousVal = this.value;
            this.value = '';
        });

        el.addEventListener('blur', function() {
            if (this.value.trim() === '') {
                this.value = (this.dataset.previousVal !== undefined && this.dataset.previousVal !== '') ? this.dataset.previousVal : '0';
                this.dispatchEvent(new Event('input', { bubbles: true }));
            }
        });

        el.addEventListener('input', calculateArrears);
        el.addEventListener('change', calculateArrears);
    });

    const formContainer = document.querySelector('.card .form-grid');
    if (formContainer) {
        formContainer.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const inputs = Array.from(formContainer.querySelectorAll('input, select')).filter(inp => inp.offsetParent !== null && !inp.readOnly);
                const currentIndex = inputs.indexOf(e.target);
                if (currentIndex !== -1 && currentIndex < inputs.length - 1) {
                    inputs[currentIndex + 1].focus();
                }
            }
        });
    }

    document.querySelectorAll('.form-grid input, .form-grid select').forEach(element => {
        if (['previousDa', 'revisedDa', 'basicPay', 'gpfNps', 'fromMonth', 'fromYear', 'toMonth', 'toYear'].includes(element.id)) return;
        element.addEventListener('input', calculateArrears);
        element.addEventListener('change', calculateArrears);
    });

    window.onload = function() {
        initFromToDropdowns();
        toggleCpfVisibility();
        renderAcpInputs();
    };
</script>

</body>
</html>
