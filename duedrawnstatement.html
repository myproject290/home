<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Due-Drawn Statement</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23007bff%22/&gt;&lt;text x=%2250%22 y=%2255%22 font-size=%2245%22 fill=%22white%22 font-family=%22Verdana,sans-serif%22 font-weight=%22900%22 text-anchor=%22middle%22 dominant-baseline=%22central%22&gt;DDS&lt;/text&gt;&lt;/svg&gt;">

<link rel="apple-touch-icon" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23007bff%22/&gt;&lt;text x=%2250%22 y=%2255%22 font-size=%2245%22 fill=%22white%22 font-family=%22Verdana,sans-serif%22 font-weight=%22900%22 text-anchor=%22middle%22 dominant-baseline=%22central%22&gt;DDS&lt;/text&gt;&lt;/svg&gt;">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .statement-duration {
            text-align: center;
            color: #555;
            font-size: 15px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .table-container {
            width: 100%;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .table-scroll-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 4px;
        }
        .controls-container {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #f8f9fa;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #e0e6ed;
            max-width: 500px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        .control-group label {
            font-weight: 700;
            font-size: 16px;
            color: #2c3e50;
        }
        .control-group select, .control-group input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #b0bec5;
            background: #fff;
            font-size: 16px;
            color: #1a252f;
            outline: none;
            box-sizing: border-box;
        }
        .control-group input[readonly] {
            background-color: #e9ecef !important;
            color: #495057;
            cursor: not-allowed;
        }
        .control-group select:focus, .control-group input:focus {
            border-color: #0275d8;
        }
        .acp-select-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .acp-select-group select {
            flex: 1;
        }
        
        /* Summary Cards Container */
        .summary-cards {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            max-width: 500px;
        }
        .summary-card {
            flex: 1;
            min-width: 140px;
            background: #f8f9fa;
            border: 1px solid #e0e6ed;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
        }
        .summary-card.diff-card {
            background: #fff5f5;
            border-color: #feb2b2;
        }
        .summary-title {
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin-bottom: 6px;
        }
        .summary-value {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
        .summary-card.diff-card .summary-value {
            color: #ff0000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 16px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px 6px;
            vertical-align: middle;
        }
        th {
            background-color: #f8f9fa;
            color: #2c3e50;
        }
        .sub-header {
            background-color: #e9ecef;
            font-weight: bold;
        }
        .bp-input {
            width: 60px;
            padding: 4px;
            text-align: right;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            font-size: 16px;
        }
        .pct-input {
            width: 40px;
            padding: 4px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            font-size: 16px;
        }
        .pct-input[readonly] {
            background-color: #e9ecef;
            color: #495057;
            cursor: not-allowed;
        }
        .large-cell {
            min-width: 80px;
            font-weight: bold;
            background-color: #fafbfc;
        }
        .due-da, .due-da-th {
            text-align: center !important;
        }
        select {
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #fff;
            font-size: 16px;
        }
        
        tbody td:nth-child(2), thead tr:first-child th:nth-child(2) {
            text-align: left;
            padding-left: 6px;
        }

        .da-change-row, 
        .da-change-row input, 
        .da-change-row select, 
        .da-change-row span {
            color: #ff0000 !important;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .reset-btn {
            flex: 1;
            background-color: #f0ad4e;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .reset-btn:hover {
            background-color: #ec971f;
        }
        .print-btn {
            flex: 1;
            background-color: #0275d8;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .print-btn:hover {
            background-color: #025aa5;
        }
        .total-row {
            font-weight: bold;
            background-color: #f1f3f5;
        }
        .grand-total {
            color: #ff0000 !important;
            background-color: #fff !important;
            font-size: 18px;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin-top: 10mm;
                margin-bottom: 7mm;
                margin-left: 10mm;
                margin-right: 10mm;
            }
            body {
                background-color: #fff !important;
                margin: 0 !important;
                color: #000 !important;
            }
            .table-container {
                box-shadow: none !important;
                padding: 0 !important;
                width: 100% !important;
            }
            .statement-duration {
                color: #000 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .table-scroll-container {
                overflow-x: visible !important;
            }
            .summary-cards {
                display: flex !important;
                gap: 10px !important;
                margin-bottom: 15px !important;
                max-width: 100% !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .summary-card {
                background: #f8f9fa !important;
                border: 1px solid #000 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .summary-card.diff-card {
                background: #fff5f5 !important;
                border-color: #000 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            table {
                width: 100% !important;
                table-layout: fixed !important;
                font-size: 14px !important;
            }
            th, td {
                padding: 6px 4px !important;
                font-size: 14px !important;
                line-height: 1.4 !important;
                border: 1px solid #000 !important;
            }
            .large-cell {
                font-weight: normal !important;
            }
            .difference {
                font-weight: bold !important;
            }

            tbody td:nth-child(2), thead tr:first-child th:nth-child(2) {
                text-align: left !important;
                padding-left: 6px !important;
            }
            .due-da, .due-da-th {
                text-align: center !important;
            }
            th {
                background-color: #f8f9fa !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            tfoot {
                display: table-row-group !important;
            }
            .bp-input, .pct-input {
                border: none !important;
                background: transparent !important;
                box-shadow: none !important;
                font-size: 14px !important;
                padding: 0 !important;
                text-align: center !important;
                width: 100% !important;
                -webkit-appearance: none !important;
                appearance: none !important;
            }
            .da-change-row, 
            .da-change-row input, 
            .da-change-row select, 
            .da-change-row span {
                color: #000 !important;
            }
            .grand-total {
                color: #ff0000 !important;
                background-color: #fff !important;
                font-size: 16px !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .total-row {
                background-color: #fff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print, .btn-container {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<div class="table-container">
    <h2>Due-Drawn Statement</h2>
    <div id="statementDuration" class="statement-duration"></div>

    <div class="controls-container no-print">
        <div class="control-group">
            <label for="incrementMonth">Month of Annual Increment</label>
            <select id="incrementMonth" onchange="updateTableValues()">
                <option value="-1">None</option>
                <option value="0">January</option>
                <option value="1">February</option>
                <option value="2">March</option>
                <option value="3">April</option>
                <option value="4">May</option>
                <option value="5">June</option>
                <option value="6">July</option>
                <option value="7">August</option>
                <option value="8">September</option>
                <option value="9" selected>October</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>
        </div>

        <div class="control-group">
            <label for="numAcp">No. of ACP(s) during Arrear Period</label>
            <select id="numAcp" onchange="renderAcpControls(); updateTableValues();">
                <option value="0" selected>0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
        </div>

        <div id="acpContainer" style="display: flex; flex-direction: column; gap: 16px; width: 100%;"></div>

        <div class="control-group">
            <label>From Month & Year</label>
            <div class="acp-select-group">
                <select id="fromMonth" onchange="calculateMonthsFromDates()"></select>
                <select id="fromYear" onchange="calculateMonthsFromDates()"></select>
            </div>
        </div>

        <div class="control-group">
            <label>To Month & Year</label>
            <div class="acp-select-group">
                <select id="toMonth" onchange="calculateMonthsFromDates()"></select>
                <select id="toYear" onchange="calculateMonthsFromDates()"></select>
            </div>
        </div>

        <div class="control-group">
            <label for="numMonths">No. of Months</label>
            <input type="number" id="numMonths" value="12" readonly>
        </div>

        <div class="btn-container">
            <button class="reset-btn" onclick="resetTable()">🔄 Reset</button>
            <button class="print-btn" onclick="printReport()">🖨️ Print / Save as PDF</button>
        </div>
    </div>

    <div class="summary-cards">
        <div class="summary-card">
            <div class="summary-title">Total Due</div>
            <div class="summary-value" id="summaryTotalDue">0</div>
        </div>
        <div class="summary-card">
            <div class="summary-title">Total Drawn</div>
            <div class="summary-value" id="summaryTotalDrawn">0</div>
        </div>
        <div class="summary-card diff-card">
            <div class="summary-title">Total Difference</div>
            <div class="summary-value" id="summaryTotalDifference">0</div>
        </div>
    </div>

    <div class="table-scroll-container">
        <table id="statementTable">
            <colgroup>
                <col style="width: 6%;">
                <col style="width: 12%;">
                <col style="width: 7%;">
                <col style="width: 8%;">
                <col style="width: 5%;">
                <col style="width: 8%;">
                <col style="width: 8%;">
                <col style="width: 8%;">
                <col style="width: 5%;">
                <col style="width: 8%;">
                <col style="width: 8%;">
                <col style="width: 9%;">
            </colgroup>
            <thead>
                <tr>
                    <th rowspan="2">Sr. No.</th>
                    <th rowspan="2">Month</th>
                    <th rowspan="2">Year</th>
                    <th colspan="4">Due</th>
                    <th colspan="4">Drawn</th>
                    <th rowspan="2">Difference</th>
                </tr>
                <tr class="sub-header">
                    <th>Basic Pay</th>
                    <th>DA %</th>
                    <th class="due-da-th">DA</th>
                    <th>Total</th>
                    <th>Basic Pay</th>
                    <th>DA %</th>
                    <th>DA</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
            <tfoot>
                <tr class="total-row">
                    <td colspan="11" style="text-align: right; color: #ff0000 !important;">Total Difference</td>
                    <td id="grandTotal" class="grand-total">0</td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<script>
    const monthsList = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    const daRates = [
        { y: 2016, m: 6, rate: 2 },
        { y: 2017, m: 0, rate: 4 },
        { y: 2017, m: 6, rate: 5 },
        { y: 2018, m: 0, rate: 7 },
        { y: 2018, m: 6, rate: 9 },
        { y: 2019, m: 0, rate: 12 },
        { y: 2019, m: 6, rate: 17 },
        { y: 2021, m: 6, rate: 31 },
        { y: 2022, m: 0, rate: 34 },
        { y: 2022, m: 6, rate: 38 },
        { y: 2023, m: 0, rate: 42 },
        { y: 2023, m: 6, rate: 46 },
        { y: 2024, m: 0, rate: 50 },
        { y: 2024, m: 6, rate: 53 },
        { y: 2025, m: 0, rate: 55 },
        { y: 2025, m: 6, rate: 58 },
        { y: 2026, m: 0, rate: 60 }
    ];

    function getApplicableDa(m, y) {
        let targetTotalMonths = y * 12 + m;
        let applicableRate = 2;
        for (let item of daRates) {
            let itemTotalMonths = item.y * 12 + item.m;
            if (targetTotalMonths >= itemTotalMonths) {
                applicableRate = item.rate;
            } else {
                break;
            }
        }
        return applicableRate;
    }

    function generateMonthOptions(selectedM) {
        let options = '';
        monthsList.forEach((m, idx) => {
            const selected = (idx === selectedM) ? 'selected' : '';
            options += `<option value="${idx}" ${selected}>${m}</option>`;
        });
        return options;
    }

    function generateYearOptions(selectedY) {
        let options = '';
        for (let y = 2000; y <= 2050; y++) {
            const selected = (y === selectedY) ? 'selected' : '';
            options += `<option value="${y}" ${selected}>${y}</option>`;
        }
        return options;
    }

    function initDateDropdowns() {
        document.getElementById('fromMonth').innerHTML = generateMonthOptions(9); // October
        document.getElementById('fromYear').innerHTML = generateYearOptions(2016);
        document.getElementById('toMonth').innerHTML = generateMonthOptions(8); // September
        document.getElementById('toYear').innerHTML = generateYearOptions(2017);
    }

    function calculateMonthsFromDates() {
        const fM = parseInt(document.getElementById('fromMonth').value);
        const fY = parseInt(document.getElementById('fromYear').value);
        const tM = parseInt(document.getElementById('toMonth').value);
        const tY = parseInt(document.getElementById('toYear').value);

        let total = (tY - fY) * 12 + (tM - fM) + 1;
        if (total < 1) total = 1;

        document.getElementById('numMonths').value = total;
        adjustRowCount();
    }

    function renderAcpControls() {
        const count = parseInt(document.getElementById('numAcp').value) || 0;
        const container = document.getElementById('acpContainer');
        
        let defaultAcpDates = [
            { month: 9, year: 2011 },
            { month: 9, year: 2016 },
            { month: 9, year: 2021 }
        ];

        let existingValues = [];
        for (let i = 1; i <= 3; i++) {
            let mEl = document.getElementById(`acpMonth_${i}`);
            let yEl = document.getElementById(`acpYear_${i}`);
            if (mEl && yEl) {
                existingValues.push({ month: parseInt(mEl.value), year: parseInt(yEl.value) });
            } else {
                existingValues.push(defaultAcpDates[i-1]);
            }
        }

        container.innerHTML = '';

        for (let i = 1; i <= count; i++) {
            let selM = existingValues[i-1].month;
            let selY = existingValues[i-1].year;
            let labelText = (count === 1) ? "Month-Year of ACP" : `Month-Year of ACP ${i}`;

            let div = document.createElement('div');
            div.className = 'control-group';
            div.innerHTML = `
                <label>${labelText}</label>
                <div class="acp-select-group">
                    <select id="acpMonth_${i}" onchange="updateTableValues()">
                        ${generateMonthOptions(selM)}
                    </select>
                    <select id="acpYear_${i}" onchange="updateTableValues()">
                        ${generateYearOptions(selY)}
                    </select>
                </div>
            `;
            container.appendChild(div);
        }
    }

    function initTable() {
        initDateDropdowns();
        renderAcpControls();
        calculateMonthsFromDates();
    }

    function resetTable() {
        document.getElementById('tableBody').innerHTML = '';
        initDateDropdowns();
        document.getElementById('incrementMonth').value = "9";
        document.getElementById('numAcp').value = "0";
        renderAcpControls();
        calculateMonthsFromDates();
    }

    function appendRow(i) {
        const tbody = document.getElementById('tableBody');
        const tr = document.createElement('tr');

        tr.innerHTML = `
            <td class="row-num">${tbody.rows.length + 1}</td>
            <td class="month-cell"><span class="month-label"></span></td>
            <td class="year-cell"><span class="year-label"></span></td>
            <td><input type="number" class="bp-input due-bp" value="42500" onfocus="this.select()" oninput="calculateRow(this)"></td>
            <td><input type="number" class="pct-input due-da-pct" value="2" onfocus="this.select()" oninput="calculateRow(this)"></td>
            <td class="large-cell due-da">0</td>
            <td class="large-cell due-total">0</td>
            <td><input type="number" class="bp-input drawn-bp" value="41300" onfocus="this.select()" oninput="calculateRow(this)"></td>
            <td><input type="number" class="pct-input drawn-pct" value="2" readonly tabindex="-1"></td>
            <td class="large-cell drawn-da">0</td>
            <td class="large-cell drawn-total">0</td>
            <td class="difference large-cell">0</td>
        `;
        tbody.appendChild(tr);
    }

    function adjustRowCount() {
        const targetCount = parseInt(document.getElementById('numMonths').value) || 1;
        const tbody = document.getElementById('tableBody');
        const currentCount = tbody.rows.length;

        if (targetCount > currentCount) {
            for (let i = currentCount; i < targetCount; i++) {
                appendRow(i);
            }
        } else if (targetCount < currentCount) {
            for (let i = currentCount; i > targetCount; i--) {
                tbody.lastElementChild.remove();
            }
        }
        updateTableValues();
    }

    function updateTableValues() {
        const startM = parseInt(document.getElementById('fromMonth').value);
        const startY = parseInt(document.getElementById('fromYear').value);
        const incrementMonth = parseInt(document.getElementById('incrementMonth').value);
        const numAcp = parseInt(document.getElementById('numAcp').value) || 0;

        let acpList = [];
        for (let i = 1; i <= numAcp; i++) {
            let mEl = document.getElementById(`acpMonth_${i}`);
            let yEl = document.getElementById(`acpYear_${i}`);
            if (mEl && yEl) {
                acpList.push({ month: parseInt(mEl.value), year: parseInt(yEl.value) });
            }
        }

        const rows = document.querySelectorAll('#tableBody tr');
        
        let currentDueBP = 0;
        let currentDrawnBP = 0;
        
        let lastIncYear = (incrementMonth !== -1 && startM < incrementMonth) ? startY - 1 : startY;

        let currentDueDaPct = getApplicableDa(startM, startY);
        let manualOverrideActive = false;

        rows.forEach((tr, idx) => {
            let totalMonths = startM + idx;
            let mIdx = totalMonths % 12;
            let yVal = startY + Math.floor(totalMonths / 12);

            const monthCell = tr.querySelector('.month-label');
            const yearCell = tr.querySelector('.year-label');

            if (monthCell) monthCell.textContent = monthsList[mIdx];
            if (yearCell) yearCell.textContent = yVal;

            if (mIdx === 0 || mIdx === 6) {
                tr.classList.add('da-change-row');
            } else {
                tr.classList.remove('da-change-row');
            }

            const dueBpInput = tr.querySelector('.due-bp');
            const drawnBpInput = tr.querySelector('.drawn-bp');
            const dueDaPctInput = tr.querySelector('.due-da-pct');
            const drawnPctInput = tr.querySelector('.drawn-pct');

            if (idx === 0) {
                currentDueBP = parseFloat(dueBpInput.value) || 0;
                currentDrawnBP = parseFloat(drawnBpInput.value) || 0;
            } else {
                let isIncMonth = (incrementMonth !== -1 && mIdx === incrementMonth);
                if (isIncMonth && yVal > lastIncYear) {
                    let incDue = Math.round((currentDueBP * 0.03) / 100) * 100;
                    currentDueBP += incDue;

                    let incDrawn = Math.round((currentDrawnBP * 0.03) / 100) * 100;
                    currentDrawnBP += incDrawn;

                    lastIncYear = yVal;
                }

                acpList.forEach(acp => {
                    if (acp.month === mIdx && acp.year === yVal) {
                        let acpIncDue = Math.round((currentDueBP * 0.03) / 100) * 100;
                        currentDueBP += acpIncDue;

                        let acpIncDrawn = Math.round((currentDrawnBP * 0.03) / 100) * 100;
                        currentDrawnBP += acpIncDrawn;
                    }
                });

                if (dueBpInput.dataset.manual === "true") {
                    currentDueBP = parseFloat(dueBpInput.value) || 0;
                } else {
                    dueBpInput.value = currentDueBP;
                }

                if (drawnBpInput.dataset.manual === "true") {
                    currentDrawnBP = parseFloat(drawnBpInput.value) || 0;
                } else {
                    drawnBpInput.value = currentDrawnBP;
                }
            }

            let defaultDa = getApplicableDa(mIdx, yVal);

            if (tr.dataset.manualDa === "true") {
                let val = parseFloat(dueDaPctInput.value);
                if (!isNaN(val)) {
                    currentDueDaPct = val;
                    manualOverrideActive = true;
                }
            } else {
                if (!manualOverrideActive) {
                    currentDueDaPct = defaultDa;
                }
            }

            dueDaPctInput.value = currentDueDaPct;
            drawnPctInput.value = dueDaPctInput.value;

            calculateRowMath(tr);
        });

        updateDurationDisplay();
        updateGrandTotal();
    }

    function updateDurationDisplay() {
        const rows = document.querySelectorAll('#tableBody tr');
        const durationEl = document.getElementById('statementDuration');
        if (!durationEl || rows.length === 0) return;

        const firstRow = rows[0];
        const lastRow = rows[rows.length - 1];

        const firstMonth = firstRow.querySelector('.month-label')?.textContent || '';
        const firstYear = firstRow.querySelector('.year-label')?.textContent || '';
        const lastMonth = lastRow.querySelector('.month-label')?.textContent || '';
        const lastYear = lastRow.querySelector('.year-label')?.textContent || '';

        if (firstMonth && firstYear && lastMonth && lastYear) {
            durationEl.textContent = `(${firstMonth} ${firstYear} to ${lastMonth} ${lastYear})`;
        } else {
            durationEl.textContent = '';
        }
    }

    function calculateRow(element) {
        if (element.classList.contains('due-da-pct')) {
            element.closest('tr').dataset.manualDa = "true";
        }
        if (element.classList.contains('due-bp') || element.classList.contains('drawn-bp')) {
            if (element.value === "") {
                delete element.dataset.manual;
            } else {
                element.dataset.manual = "true";
            }
        }
        updateTableValues();
    }

    function calculateRowMath(tr) {
        const dueBp = parseFloat(tr.querySelector('.due-bp').value) || 0;
        const dueDaPct = parseFloat(tr.querySelector('.due-da-pct').value) || 0;
        const dueDa = Math.round((dueBp * dueDaPct) / 100);
        const dueTotal = dueBp + dueDa;

        tr.querySelector('.due-da').textContent = dueDa;
        tr.querySelector('.due-total').textContent = dueTotal;

        const drawnBp = parseFloat(tr.querySelector('.drawn-bp').value) || 0;
        const drawnPct = parseFloat(tr.querySelector('.drawn-pct').value) || 0;
        const drawnDa = Math.round((drawnBp * drawnPct) / 100);
        const drawnTotal = drawnBp + drawnDa;

        tr.querySelector('.drawn-da').textContent = drawnDa;
        tr.querySelector('.drawn-total').textContent = drawnTotal;

        const difference = dueTotal - drawnTotal;
        tr.querySelector('.difference').textContent = difference;
    }

    function updateGrandTotal() {
        let totalDue = 0;
        let totalDrawn = 0;
        let grandTotal = 0;

        document.querySelectorAll('#tableBody tr').forEach(tr => {
            totalDue += parseFloat(tr.querySelector('.due-total').textContent) || 0;
            totalDrawn += parseFloat(tr.querySelector('.drawn-total').textContent) || 0;
            grandTotal += parseFloat(tr.querySelector('.difference').textContent) || 0;
        });

        document.getElementById('summaryTotalDue').textContent = totalDue;
        document.getElementById('summaryTotalDrawn').textContent = totalDrawn;
        document.getElementById('summaryTotalDifference').textContent = grandTotal;
        document.getElementById('grandTotal').textContent = grandTotal;
    }

    function printReport() {
        if (window.Android && typeof window.Android.printPage === 'function') {
            window.Android.printPage('Due-Drawn Statement');
        } else {
            window.print();
        }
    }

    window.onload = initTable;
</script>

</body>
</html>
